<head>
    <meta name="viewport" content="device=device-width,initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static',filename='styles.css')}}">
</head>

<body>
    <div class="container">
        <h2>transferMoney</h2>   
        <input type="text" id="depositor" placeholder="Enter Depositor Address">
        <input type="number" id="amount" placeholder="Enter Amount">
        
        <button class="btn" onclick="deposit()">Deposit</button>
        <button class="btn" onclick="transaction()">View Transaction</button>

        <form action="/main" method="post">
            <input type="submit" value="main">
        </form>
        <h6>
            <p id="view_depositor"></p>
            <p id="view_amount"></p>
        </h6>
        

        <script src="https://cdn.jsdelivr.net/npm/web3@1.5.2/dist/web3.min.js"></script>
        <script>
            const contractAddress = "0x5bb9cd5e5cdfc630082afbdd17a229d4d7d2da89"

            const contractABI = [

        {

          "inputs": [

            {

              "internalType": "address",

              "name": "payer_add",

              "type": "address"

            },

            {

              "internalType": "address",

              "name": "payee_add",

              "type": "address"

            },

            {

              "internalType": "uint256",

              "name": "amount_transfer",

              "type": "uint256"

            }

          ],

          "name": "transfer",

          "outputs": [],

          "stateMutability": "nonpayable",

          "type": "function"

        },

        {

          "inputs": [],

          "name": "transaction",

          "outputs": [

            {

              "internalType": "address",

              "name": "",

              "type": "address"

            },

            {

              "internalType": "address",

              "name": "",

              "type": "address"

            },

            {

              "internalType": "uint256",

              "name": "",

              "type": "uint256"

            }

          ],

          "stateMutability": "view",

          "type": "function"

        }

      ]

            const web3 = new Web3(Web3.givenProvider)

            const contract = new web3.eth.Contract(contractABI,contractAddress)

            async function deposit() {
                const accounts = await web3.eth.requestAccounts()
                const depositor = document.getElementById('depositor').value;
                const amount = document.getElementById('amount').value;
                console.log(depositor,amount)
                console.log("account[0]" + accounts[0])
                await contract.methods.depositMoney(depositor,amount).send({ from: accounts[0]});
            }

            async function transaction() {
                const result = await contract.methods.newDeposit().call();
                document.getElementById('view_depositor').innerText = "Depositor: " + result[0];
                document.getElementById('view_amount').innerText = "Amount: " + result[1]
                console.log(result[0], result[1])
            }




        </script>



    </div>
</body>
